name: jw-agenda Check Common Sync

on:
  pull_request:
    paths:
      - 'jw-agenda/_common/**'
      - 'jw-agenda/skills/**/assets/**'
  push:
    branches:
      - main
      - dev
    paths:
      - 'jw-agenda/_common/**'
      - 'jw-agenda/skills/**/assets/**'

permissions:
  contents: write  # Required for auto-sync on push

jobs:
  check-sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jw-agenda
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Check if _common/ has changes
        id: check_common
        run: |
          if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -q "^jw-agenda/_common/"; then
            echo "has_common_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_common_changes=false" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true
      
      - name: Verify sync status
        id: check_sync
        run: |
          chmod +x ./scripts/check-common-sync.sh
          ./scripts/check-common-sync.sh || echo "sync_needed=true" >> $GITHUB_OUTPUT
        continue-on-error: true
      
      - name: Auto-sync if needed (push only)
        if: steps.check_sync.outputs.sync_needed == 'true' && github.event_name == 'push'
        run: |
          echo "::notice::Auto-syncing _common/ changes to all skill assets/"
          chmod +x ./scripts/sync-common-to-skills.sh
          ./scripts/sync-common-to-skills.sh
          
          # Check if there are changes to commit
          if [ -n "$(git status --porcelain jw-agenda/skills/)" ]; then
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add jw-agenda/skills/*/assets/
            git commit -m "chore: auto-sync _common/ changes to skill assets/"
            git push
            echo "::notice::Successfully auto-synced and committed changes"
          else
            echo "::notice::No changes to sync"
          fi
      
      - name: Show sync instructions if failed (PR)
        if: steps.check_sync.outputs.sync_needed == 'true' && github.event_name == 'pull_request'
        run: |
          echo "::error::Found inconsistencies between _common/ and skill assets/"
          echo "::error::Please run './scripts/sync-common-to-skills.sh' locally and commit the changes"
          echo ""
          echo "To fix this locally:"
          echo "  cd jw-agenda"
          echo "  ./scripts/sync-common-to-skills.sh"
          echo "  git add skills/*/assets/"
          echo "  git commit -m 'chore: sync _common/ changes to skill assets/'"
          exit 1
